<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inkplate_dash</title>
<link rel="icon" type="image/svg+xml" href="https://bix.computer/favicon.svg">
<style>
  /* Catppuccin Mocha — house palette (matches bix-ai / bix-demucs) */
  :root {
    --bg:#1e1e2e; --surface0:#313244; --surface1:#45475a;
    --text:#cdd6f4; --subtext:#a6adc8;
    --yellow:#f9e2af; --green:#a6e3a1; --red:#f38ba8; --mauve:#cba6f7;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 system-ui, -apple-system, sans-serif;
  }
  header {
    display:flex; align-items:center; gap:14px;
    padding:14px 22px; border-bottom:1px solid var(--surface1);
  }
  header h1 { font-size:17px; margin:0; }
  header h1 em { color:var(--mauve); font-style:normal; }
  .dev-badge { display:flex; align-items:center; gap:7px; color:var(--subtext); font-size:13px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--surface1); }
  .dot.ok   { background:var(--green); }
  .dot.warn { background:var(--yellow); }
  .dot.bad  { background:var(--red); }
  header .spacer { margin-left:auto; }

  main {
    display:grid; grid-template-columns: 1fr 360px; gap:18px;
    padding:18px 22px; max-width:1400px; margin:0 auto;
  }
  @media (max-width: 980px) { main { grid-template-columns:1fr; } }

  .card { background:var(--surface0); border:1px solid var(--surface1); border-radius:10px; padding:16px; }
  .card h2 {
    margin:0 0 12px; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--subtext); font-weight:600;
  }
  .col { display:flex; flex-direction:column; gap:18px; min-width:0; }

  /* Preview: the panel simulation, the print dragged on it (placement.js).
     Panel hung vertically: previews are upright (what's on the wall), so the
     frame turns with it, kept to a sane height instead of the full column. */
  #preview.portrait { --pl-maxh: min(78vh, 900px); }
  #preview-ctl:empty { display:none; }
  #preview-ctl { margin-top:10px; }
  .preview-bar { display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .meta-line { color:var(--subtext); font-size:12px; margin-top:8px; }

  button.primary {
    background:var(--mauve); color:#11111b; border:none; border-radius:7px;
    padding:7px 14px; font:inherit; font-weight:600; cursor:pointer;
  }
  button.primary:disabled { opacity:.5; cursor:default; }
  button.ghost {
    background:none; border:1px solid var(--surface1); color:var(--text);
    border-radius:7px; padding:7px 14px; font:inherit; cursor:pointer;
  }

  /* Config form */
  .field { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:11px; }
  .field label { color:var(--subtext); }
  .field select, .field input[type=number] {
    background:var(--bg); color:var(--text); border:1px solid var(--surface1);
    border-radius:6px; padding:6px 8px; font:inherit; width:140px;
    font-variant-numeric:tabular-nums;
  }
  .field input[type=checkbox] { accent-color:var(--mauve); width:16px; height:16px; }
  #save-msg { font-size:12px; margin-left:8px; }
  #save-msg.ok { color:var(--green); } #save-msg.err { color:var(--red); }

  /* Stats grid (house .hi-stat pattern) */
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat { background:var(--bg); border-radius:7px; padding:8px 10px; }
  .stat .k { color:var(--subtext); font-size:11px; }
  .stat .v { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
  .stat .v.green { color:var(--green); } .stat .v.red { color:var(--red); }

  /* Now showing */
  .now-row { margin-bottom:14px; }
  .now-row .k { color:var(--subtext); font-size:11px; margin-bottom:4px; }
  .now-row .v { font-weight:600; }
  .now-row .sub { color:var(--subtext); font-size:12px; }
  .btn-row { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  button.danger {
    background:none; border:1px solid var(--red); color:var(--red);
    border-radius:7px; padding:5px 12px; font:inherit; cursor:pointer;
  }
  button.danger:disabled, button.ghost:disabled, .switcher button:disabled { opacity:.5; cursor:default; }
  .msg { font-size:12px; } .msg.ok { color:var(--green); } .msg.err { color:var(--red); }

  /* Screen switcher: the active one is filled and bold, not just coloured. */
  .switcher { max-width:1400px; margin:0 auto; padding:18px 22px 0; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .switcher .seg { display:flex; border:1px solid var(--surface1); border-radius:8px; overflow:hidden; }
  .switcher button {
    min-height:44px; min-width:120px; padding:0 18px; font:inherit; font-size:15px;
    background:none; color:var(--text); border:none; cursor:pointer;
  }
  .switcher button + button { border-left:1px solid var(--surface1); }
  .switcher button[aria-pressed="true"] { background:var(--mauve); color:#11111b; font-weight:700; }
</style>
</head>
<body>
<header>
  <h1>inkplate<em>_</em>dash</h1>
  <div class="dev-badge"><span class="dot" id="dev-dot"></span><span id="dev-status">loading…</span></div>
</header>

<div class="switcher" role="group" aria-label="Screen">
  <div class="seg">
    <button type="button" data-screen="dashboard" aria-pressed="false">Dashboard</button>
    <button type="button" data-screen="daily" aria-pressed="false">Daily</button>
  </div>
  <span class="msg" id="switch-msg"></span>
</div>

<main>
  <div class="col">
    <div class="card">
      <div id="preview"></div>
      <div id="preview-ctl"></div>
      <div class="preview-bar">
        <button class="primary" id="btn-render">Render now → push</button>
        <button class="ghost" id="btn-cycle-animal">Next animal</button>
      </div>
    </div>

    <div class="card">
      <h2>Device</h2>
      <div class="stats" id="dev-stats"></div>
    </div>

  </div>

  <div class="col">
    <div class="card">
      <h2>Now showing</h2>
      <div class="now-row" style="margin-bottom:0">
        <div class="k">Animal</div>
        <div class="v" id="now-animal">—</div>
        <div class="sub" id="now-animal-sub"></div>
        <div class="btn-row">
          <button class="ghost" id="btn-rotate-animal" title="Turn the plate a quarter clockwise — for a scan bound in sideways. Remembered for this image.">Rotate ↻</button>
          <button class="danger" id="btn-veto-animal">Veto image</button>
        </div>
        <div class="meta-line"><a href="review" style="color:var(--text)">Review upcoming prints</a></div>
      </div>
    </div>

    <div class="card">
      <h2>Configuration</h2>
      <div class="field"><label for="f-rotation" title="How the panel is hung: degrees turned clockwise from landscape. 90°/270° draw the dashboard portrait; the device still receives its native 1600×1200 frame, pre-turned.">Panel rotation</label>
        <select id="f-rotation">
          <option value="0">0° · landscape</option>
          <option value="90">90° · portrait</option>
          <option value="180">180° · upside down</option>
          <option value="270">270° · portrait</option>
        </select></div>
      <div class="field" id="field-portrait-layout"><label for="f-portrait-layout" title="hero: engraving centred above a symmetric weather band (temperature centred, forecast left, sunrise/sunset right) and a centred snow row along the bottom border. stack: weather and caption on top, engraving below.">Portrait layout</label><select id="f-portrait-layout"></select></div>
      <div class="field"><label for="f-refresh" title="How often the panel itself redraws — governs how fresh the temperature is. Slots count from a daily anchor (06:00 by default), so there is always a refresh then.">Refresh cadence (min)</label><input id="f-refresh" type="number" min="1" max="1440"></div>
      <div class="field"><label for="f-animal-period" title="How often a new engraving is chosen.">Animal cadence (days)</label><input id="f-animal-period" type="number" min="1" max="365"></div>
      <div class="field"><label for="f-tethered">Tethered mode (no deep sleep)</label><input id="f-tethered" type="checkbox"></div>
      <div class="field"><label for="f-poll">Tethered poll (sec)</label><input id="f-poll" type="number" min="5" max="600"></div>
      <div class="field"><label for="f-location">Weather location</label><input id="f-location" type="text" maxlength="60" style="width:140px;background:var(--bg);color:var(--text);border:1px solid var(--surface1);border-radius:6px;padding:6px 8px;font:inherit"></div>
      <div class="field"><label for="f-lat">Latitude</label><input id="f-lat" type="number" step="0.0001" min="-90" max="90"></div>
      <div class="field"><label for="f-lon">Longitude</label><input id="f-lon" type="number" step="0.0001" min="-180" max="180"></div>
      <div class="field" style="margin-top:16px"><label for="f-snow" title="Seasonal: turn off when the lifts close — the line disappears and nothing is fetched.">Snow report</label><input id="f-snow" type="checkbox"></div>
      <div class="field"><label for="f-snow-name">Snow location</label><input id="f-snow-name" type="text" maxlength="60" style="width:140px;background:var(--bg);color:var(--text);border:1px solid var(--surface1);border-radius:6px;padding:6px 8px;font:inherit"></div>
      <div class="field"><label for="f-snow-lat">Snow latitude</label><input id="f-snow-lat" type="number" step="0.0001" min="-90" max="90"></div>
      <div class="field"><label for="f-snow-lon">Snow longitude</label><input id="f-snow-lon" type="number" step="0.0001" min="-180" max="180"></div>
      <div style="display:flex;align-items:center">
        <button class="primary" id="btn-save">Save</button><span id="save-msg"></span>
      </div>
    </div>

    <div class="card">
      <h2>Test patterns</h2>
      <div class="field"><label for="f-screen" title="Shows a test pattern instead of the Dashboard or Daily screen; applies at once.">Pattern</label><select id="f-screen"></select></div>
    </div>
  </div>
</main>

<script src="placement.js"></script>
<script>
// All URLs are relative on purpose: this page is served both at :3008/ and at
// the metrics site under /inkplate/ — absolute paths would break the latter.
const $ = id => document.getElementById(id);

function ago(ts) {
  const s = Math.max(0, (Date.now()/1000) - ts);
  if (s < 90) return Math.round(s) + 's ago';
  if (s < 5400) return Math.round(s/60) + 'm ago';
  if (s < 172800) return (s/3600).toFixed(1) + 'h ago';
  return Math.round(s/86400) + 'd ago';
}

// The preview: the panel simulation, with the print dragged on it while
// the panel shows a print screen (placement.js). Remounted when the print,
// the screen, the art layout or the hanging changes.
let pane = null, paneKey = null;
function mountPreview(st) {
  const a = st.current && st.current.animal;
  const screen = st.config.screen;
  const draggable = !!(a && a.file && MAIN_SCREENS.includes(screen));
  const rot = st.config.rotation, portrait = rot === 90 || rot === 270;
  const key = [draggable ? a.file : '', screen, st.art_layout.key, rot].join('|');
  if (pane && key === paneKey) return;
  if (pane) pane.destroy();
  paneKey = key;
  $('preview').classList.toggle('portrait', portrait);
  pane = Placement.mount({stage: $('preview'), controls: $('preview-ctl')}, {
    restUrl: () => 'api/preview.png?mode=panel&t=' + Date.now(),
    file: draggable ? a.file : null, screen: draggable ? screen : null,
    layoutName: st.art_layout.name, aspect: portrait ? 3 / 4 : 4 / 3,
    alt: 'The panel as it shows now',
    onSaved: () => loadState(),
  });
}
function refreshPreviewImg() {
  if (pane) pane.refresh();
}

$('btn-render').addEventListener('click', async () => {
  const btn = $('btn-render');
  btn.disabled = true; btn.textContent = 'Rendering…';
  try {
    const r = await fetch('api/render', {method:'POST'});
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    await loadState();
    refreshPreviewImg();
  } catch (e) {
    alert('Render failed: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Render now → push';
  }
});

async function cycle(what, btn) {
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = '…';
  try {
    const r = await fetch('api/cycle', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({what}),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    await loadState();
    refreshPreviewImg();
  } catch (e) {
    alert('Cycle failed: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
}
$('btn-cycle-animal').addEventListener('click', e => cycle('animal', e.target));

$('btn-save').addEventListener('click', async () => {
  const msg = $('save-msg');
  msg.textContent = ''; msg.className = '';
  try {
    const r = await fetch('api/config', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        rotation: parseInt($('f-rotation').value, 10),
        portrait_layout: $('f-portrait-layout').value,
        refresh_minutes: parseInt($('f-refresh').value, 10),
        tethered: $('f-tethered').checked,
        tethered_poll_seconds: parseInt($('f-poll').value, 10),
        animal_period_days: parseInt($('f-animal-period').value, 10),
        location_name: $('f-location').value,
        latitude: parseFloat($('f-lat').value),
        longitude: parseFloat($('f-lon').value),
        show_snow: $('f-snow').checked,
        snow_location_name: $('f-snow-name').value,
        snow_latitude: parseFloat($('f-snow-lat').value),
        snow_longitude: parseFloat($('f-snow-lon').value),
      }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    msg.textContent = 'saved'; msg.className = 'ok';
    await loadState();
    refreshPreviewImg();  // screen may have changed
  } catch (e) {
    msg.textContent = 'failed: ' + e.message; msg.className = 'err';
  }
  setTimeout(() => { msg.textContent = ''; }, 3000);
});

// ── Screen: the switcher (Dashboard / Daily) and the test-pattern picker ──
// Both set the panel's screen through api/config, then re-render the preview.
const MAIN_SCREENS = ['dashboard', 'daily'];
async function setScreen(screen, msgEl) {
  document.querySelectorAll('.switcher button').forEach(b => { b.disabled = true; });
  try {
    await api('POST', 'api/config', {screen});
    await loadState();
    refreshPreviewImg();
  } catch (e) {
    flash(msgEl, 'failed: ' + e.message, false);
  } finally {
    document.querySelectorAll('.switcher button').forEach(b => { b.disabled = false; });
  }
}
document.querySelectorAll('.switcher button').forEach(b =>
  b.addEventListener('click', () => setScreen(b.dataset.screen, $('switch-msg'))));
$('f-screen').addEventListener('change', e => {
  if (e.target.value) setScreen(e.target.value, $('save-msg'));
});
function renderScreen(st) {
  document.querySelectorAll('.switcher button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.screen === st.config.screen)));
  const sel = $('f-screen');
  const patterns = st.screens.filter(s => !MAIN_SCREENS.includes(s));
  if (sel.options.length !== patterns.length + 1) {
    sel.innerHTML = '<option value="">none</option>' +
      patterns.map(s => `<option value="${s}">${s}</option>`).join('');
  }
  if (document.activeElement !== sel) {
    sel.value = patterns.includes(st.config.screen) ? st.config.screen : '';
  }
}

function flash(el, text, ok) {
  el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err');
  setTimeout(() => { el.textContent = ''; }, 3000);
}
async function api(method, url, body) {
  const r = await fetch(url, {method, headers:{'Content-Type':'application/json'},
                              body: body === undefined ? undefined : JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.status);
  return j;
}

// ── Now showing: veto ──
function renderNow(st) {
  const cur = st.current;
  if (!cur) return;
  const a = cur.animal;
  const layout = st.art_layout.key;
  $('now-animal').textContent = a ? a.common_name : 'none cached yet';
  $('now-animal-sub').textContent = a ? [a.sci_name, a.year, a.artist,
    a.rotation ? 'turned ' + a.rotation + '°' : null,
    a.placements[layout] ? 'adjusted' : null,
  ].filter(Boolean).join(' · ') : '';
  $('btn-veto-animal').disabled = !(a && a.file);
  $('btn-rotate-animal').disabled = !(a && a.file);
}

async function veto(what, btn) {
  if (!confirm(`Veto this image? It's removed from rotation for good.`)) return;
  btn.disabled = true;
  try {
    await api('POST', 'api/veto', {what});
  } catch (e) { alert('Veto failed: ' + e.message); }
  finally { btn.disabled = false; await loadState(); refreshPreviewImg(); }
}
$('btn-veto-animal').addEventListener('click', e => veto('animal', e.target));

async function rotateAnimal(btn) {
  btn.disabled = true;
  try {
    await api('POST', 'api/rotate', {degrees: 90});
  } catch (e) { alert('Rotate failed: ' + e.message); }
  finally {
    btn.disabled = false; await loadState();
    if (pane) pane.reload();   // the layers too: the plate turned
  }
}
$('btn-rotate-animal').addEventListener('click', e => rotateAnimal(e.target));

function renderDeviceBadge(st) {
  const dot = $('dev-dot'), label = $('dev-status');
  const last = st.last_checkin;
  if (!last) { dot.className = 'dot'; label.textContent = 'device: never seen (pre-arrival)'; return; }
  const ageS = (Date.now()/1000) - last.ts;
  const expected = st.config.tethered ? st.config.tethered_poll_seconds * 3
                                      : st.config.refresh_minutes * 60 * 2.5;
  if (ageS < expected) { dot.className = 'dot ok'; label.textContent = 'device: online · ' + ago(last.ts); }
  else { dot.className = 'dot bad'; label.textContent = 'device: missing · last seen ' + ago(last.ts); }
}

function renderState(st) {
  renderDeviceBadge(st);
  renderNow(st);
  mountPreview(st);

  // config form — don't clobber fields the user is editing
  const focused = document.activeElement && document.activeElement.id;
  renderScreen(st);
  const pl = $('f-portrait-layout');
  if (pl.options.length !== st.portrait_layouts.length) {
    pl.innerHTML = st.portrait_layouts.map(s => `<option value="${s}">${s}</option>`).join('');
  }
  if (focused !== 'f-portrait-layout') pl.value = st.config.portrait_layout;
  if (focused !== 'f-rotation') $('f-rotation').value = st.config.rotation;
  if (focused !== 'f-refresh') $('f-refresh').value = st.config.refresh_minutes;
  $('f-tethered').checked = st.config.tethered;
  if (focused !== 'f-poll') $('f-poll').value = st.config.tethered_poll_seconds;
  if (focused !== 'f-animal-period') $('f-animal-period').value = st.config.animal_period_days;
  if (focused !== 'f-location') $('f-location').value = st.config.location_name;
  if (focused !== 'f-lat') $('f-lat').value = st.config.latitude;
  if (focused !== 'f-lon') $('f-lon').value = st.config.longitude;
  $('f-snow').checked = st.config.show_snow;
  if (focused !== 'f-snow-name') $('f-snow-name').value = st.config.snow_location_name;
  if (focused !== 'f-snow-lat') $('f-snow-lat').value = st.config.snow_latitude;
  if (focused !== 'f-snow-lon') $('f-snow-lon').value = st.config.snow_longitude;

  // device stats
  const last = st.last_checkin;
  const stats = [];
  if (last) {
    const pct = st.battery_percent;
    stats.push(['Battery', pct != null ? `${pct}% · ${last.battery_voltage.toFixed(2)} V` : '—',
                pct != null && pct <= 20 ? 'red' : 'green']);
  } else {
    stats.push(['Last seen', 'never', '']);
  }
  $('dev-stats').innerHTML = stats.map(([k, v, c]) =>
    `<div class="stat"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`).join('');
}

async function loadState() {
  try {
    const r = await fetch('api/state');
    if (!r.ok) throw new Error(r.status);
    renderState(await r.json());
  } catch (e) {
    $('dev-dot').className = 'dot bad';
    $('dev-status').textContent = 'server unreachable';
  }
}

setInterval(loadState, 10000);
loadState();
</script>
</body>
</html>
